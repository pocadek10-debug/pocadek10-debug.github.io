<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Trail</title>
  <meta name="description" content="Paper Trail is a faceless YouTube Shorts channel about history.">
  <style>
    :root {
      --paper: #f4ecdc;
      --ink: #2b2620;
      --muted: #6b6155;
      --accent: #8a3b24;
      --line: #d9ccb4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 72px 20px 48px;
    }
    .eyebrow {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
    }
    h1 {
      font-size: 3rem;
      line-height: 1.1;
      margin: 0 0 24px;
    }
    p { font-size: 1.1rem; margin: 0 0 16px; }
    .button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 22px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 600;
    }
    .button:hover, .button:focus { background: #6f2e1b; }
    footer {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 20px 48px;
      border-top: 1px solid var(--line);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.9rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">YouTube Shorts</p>
    <h1>Paper Trail</h1>
    <p>Paper Trail is a faceless history channel. Each Short tells one story from the past in a short vertical video.</p>
    <a class="button" href="https://www.youtube.com/channel/UCEvW3TXUiyhcGAHwbOfdQ9Q">Watch on YouTube</a>
  </main>
  <footer>
    <a href="privacy.html">Privacy Policy</a>
  </footer>
</body>
</html>
